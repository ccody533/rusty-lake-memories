<canvas id="particles"></canvas>

<div class="section">

<section class="page-hero">
  <div class="hero-bg"></div>
  <div class="hero-grid"></div>
  <div class="page-hero-inner">
    <div>
      <p class="page-hero-title">抽卡安利</p>
      <p class="page-hero-slogan">翻开命运的牌，遇见你的锈湖</p>
    </div>
  </div>
</section>

  <div class="container">

    <div class="controls">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="主线">主线</button>
      <button class="filter-btn" data-filter="外传">外传</button>
      <button class="gacha-btn" id="drawBtn">✦ 抽 卡 ✦</button>
      <button class="wishlist-toggle" id="wishlistToggle">♡ 游玩清单</button>
    </div>

    <div class="stats">
      <div>已收录 <span class="sv" id="totalWorks">0</span> 部</div>
      <div>清单 <span class="sv" id="wishCount">0</span> 部</div>
      <div>已抽 <span class="sv" id="drawCount">0</span> 次</div>
    </div>

    <div class="card-stage">
      <div class="card-container" id="cardContainer">
        <div class="card-face card-front">
          <div class="pattern"></div>
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <div class="logo-area">
            <div class="icon">🜏</div>
            <h2>RUSTY LAKE</h2>
            <p>点击按钮开始抽卡</p>
          </div>
        </div>
        <div class="card-face card-back">
          <div class="card-cover" id="cardCover">
            <img id="coverImg" src="" alt="">
            <div class="cover-overlay"></div>
            <div class="cover-content" id="coverContent"><span class="ci">🜏</span><span>CUBE ESCAPE</span></div>
            <span class="type-badge" id="typeBadge"></span>
          </div>
          <div class="card-body">
            <h3 id="cardTitle"></h3>
            <div class="meta"><span id="cardDate"></span><span id="cardType"></span></div>
            <div class="desc" id="cardDesc"></div>
            <div class="reason" id="cardReason"></div>
            <div class="platforms" id="cardPlatforms"></div>
          </div>
          <div class="card-actions">
            <button class="btn-collect" id="btnCollect">♡ 加入游玩清单</button>
            <button class="btn-redraw" id="btnRedraw">再抽一张</button>
          </div>
        </div>
      </div>
    </div>

    <p class="idle-hint" id="idleHint">— 点击「抽卡」翻开锈湖世界的一角 —</p>

    <div class="wishlist-section" id="wishlistSection">
      <h2>♡ 我的游玩清单</h2>
      <div class="wishlist-grid" id="wishlistGrid"></div>
    </div>

  </div>
</div>

<script src="data.js"></script>

<script src="js/gacha.js"></script>

</body>
